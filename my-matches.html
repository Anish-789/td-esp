<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Matches</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#fff;color:#222;padding-bottom:30px}
  .top{padding:14px 16px;border-bottom:1px solid #eee;font-weight:bold;font-size:20px;color:#ff6a00;
       position:sticky;top:0;background:#fff;z-index:3}
  .tabs{display:flex;gap:8px;padding:12px 16px}
  .tab{flex:1;text-align:center;padding:10px 4px;border-radius:12px;background:#f4f4f4;
       font-weight:bold;font-size:14px;color:#666}
  .tab.on{background:#ff6a00;color:#fff}
  .card{margin:12px 16px;padding:14px;border:1px solid #eee;border-radius:16px;
        box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:14px;line-height:1.7}
  .card h3{margin:0 0 4px;font-size:17px}
  .tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;
       background:#fff3ea;color:#ff6a00;margin-right:4px}
  .tag.live{background:#ffe8e8;color:#e53935;font-weight:bold}
  .tag.done{background:#eaf8ee;color:#1c9c4b}
  .tag.cancel{background:#f1f1f1;color:#888}
  .room{margin-top:10px;padding:12px;background:#f8f8f8;border-radius:12px}
  .room b{font-size:16px}
  .cp{margin-left:8px;border:1px solid #ff6a00;background:#fff;color:#ff6a00;
      border-radius:8px;padding:2px 8px;font-size:12px}
  .empty{text-align:center;color:#888;margin-top:50px;padding:0 24px;line-height:1.6}
</style>
</head>
<body>
<div class="top">My Matches</div>

<div class="tabs">
  <div class="tab on" data-s="upcoming">Upcoming</div>
  <div class="tab" data-s="live">Live</div>
  <div class="tab" data-s="completed">Completed</div>
</div>

<div id="list"><div class="empty">Loading...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkwQvjVjrEQqpEIIgWKshbz538lGm7DL8",
  authDomain: "td-esp.firebaseapp.com",
  projectId: "td-esp",
  storageBucket: "td-esp.firebasestorage.app",
  messagingSenderId: "1074367636296",
  appId: "1:1074367636296:web:65189df5578a98cbaa097d"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const g = id => document.getElementById(id);
const fmtDT = (ms) => {
  const d = new Date(ms), p = n => String(n).padStart(2, "0");
  let h = d.getHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + ", " + p(h) + ":" + p(d.getMinutes()) + " " + ap;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

window.cp = (t) => { navigator.clipboard.writeText(t); alert("Copied"); };

let uid = "";
try { uid = localStorage.getItem("td_uid") || ""; } catch (e) {}
let mine = [], rooms = {}, tab = "upcoming";

try {
  const c = localStorage.getItem("c_mm2_" + uid);
  if (c) mine = JSON.parse(c);
} catch (e) {}

function stateOf(m) {
  if (m.status === "completed" || m.status === "cancelled") return "completed";
  if (m.status === "live") return "live";
  return m.start && m.start <= Date.now() ? "live" : "upcoming";
}

function card(m) {
  const st = stateOf(m);
  const t = m.start ? new Date(m.start).toLocaleString() : "-";
  let tag;
  if (m.status === "cancelled") tag = '<span class="tag cancel">Cancelled (refunded)</span>';
  else if (st === "completed") tag = '<span class="tag done">Completed</span>';
  else if (st === "live") tag = '<span class="tag live">● LIVE</span>';
  else tag = '<span class="tag">Upcoming</span>';

  let room = "";
  if (st === "upcoming" || st === "live") {
    const r = rooms[m.id];
    room = r
      ? `<div class="room">Room ID: <b>${esc(r.roomId)}</b>
           <button class="cp" onclick="cp('${esc(r.roomId)}')">Copy</button><br>
         Password: <b>${esc(r.roomPass)}</b>
           <button class="cp" onclick="cp('${esc(r.roomPass)}')">Copy</button></div>`
      : '<div class="room">Room ID and password will appear here before the match</div>';
  }
  return `<div class="card">
    <h3>${esc(m.title)}</h3>
    <span class="tag">${esc(m.mode)}</span>${tag}<br>
    ${esc(m.map)} • ${t}<br>
    Entry ₹${m.entryFee} | Per Kill ₹${m.perKill} | Booyah ₹${m.booyahPrize}
    ${room}
  </div>`;
}

function render() {
  const groups = { upcoming: [], live: [], completed: [] };
  mine.forEach(m => groups[stateOf(m)].push(m));
  groups.upcoming.sort((a, b) => (a.start || 0) - (b.start || 0));
  groups.live.sort((a, b) => (b.start || 0) - (a.start || 0));
  groups.completed.sort((a, b) => (b.start || 0) - (a.start || 0));

  const names = { upcoming: "Upcoming", live: "Live", completed: "Completed" };
  document.querySelectorAll(".tab").forEach(t => {
    const s = t.dataset.s, n = groups[s].length;
    t.textContent = names[s] + (n ? " (" + n + ")" : "");
    t.classList.toggle("on", s === tab);
  });

  const items = groups[tab];
  const empty = {
    upcoming: "No upcoming matches.<br>Join a match from Home.",
    live: "No live matches right now.",
    completed: "No completed matches yet."
  };
  g("list").innerHTML = items.length
    ? items.map(card).join("")
    : '<div class="empty">' + empty[tab] + '</div>';
}

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  tab = t.dataset.s;
  render();
}));

async function load() {
  const user = auth.currentUser;
  if (!user) return;
  uid = user.uid;
  try {
    const all = await getDocs(collection(db, "matches"));
    const ms = all.docs.map(d => ({ id: d.id, ...d.data() }));
    const checks = await Promise.all(
      ms.map(m => getDoc(doc(db, "matches", m.id, "players", user.uid)))
    );
    mine = ms.filter((m, i) => checks[i].exists()).map(m => ({
      id: m.id, title: m.title, mode: m.catName || m.mode, map: m.map,
      entryFee: m.entryFee, perKill: m.perKill, booyahPrize: m.booyahPrize,
      status: m.status,
      start: m.startTime && m.startTime.toMillis ? m.startTime.toMillis() : 0
    }));
    render();
    try { localStorage.setItem("c_mm2_" + uid, JSON.stringify(mine)); } catch (e) {}

    // Room ID / password (upcoming aur live matches ke liye)
    const need = mine.filter(m => stateOf(m) !== "completed");
    await Promise.all(need.map(async m => {
      try {
        const r = await getDoc(doc(db, "matches", m.id, "secret", "room"));
        if (r.exists()) rooms[m.id] = r.data();
      } catch (e) {}
    }));
    render();
  } catch (e) {
    if (!mine.length) g("list").innerHTML = '<div class="empty" style="color:#d00">Error: ' + esc(e.message) + '</div>';
  }
}

window.refresh = load;
onAuthStateChanged(auth, (user) => {
  if (!user) { location.href = "index.html"; return; }
  load();
});
render();
setInterval(render, 30000);   // match ka time hote hi Upcoming se Live me chala jaye
</script>
</body>
</html>
