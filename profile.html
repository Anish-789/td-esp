<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#fff;color:#222;padding-bottom:110px}
  .top{padding:14px 16px;border-bottom:1px solid #eee;font-weight:bold;font-size:20px;color:#ff6a00}
  .head{text-align:center;padding:24px 16px 8px}
  .av{width:84px;height:84px;border-radius:50%;background:#ff6a00;color:#fff;
      font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
  .nm{font-size:20px;font-weight:bold}
  .em{color:#888;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
  .st{background:#fff3ea;border-radius:14px;padding:14px;text-align:center}
  .st b{display:block;font-size:22px;color:#ff6a00}
  .st span{font-size:13px;color:#666}
  .form{padding:0 16px}
  label{font-size:13px;color:#888}
  input{width:100%;padding:14px;margin:6px 0 12px;border:1px solid #ddd;border-radius:12px;font-size:16px}
  button{width:100%;padding:14px;border:none;border-radius:12px;font-size:17px;margin-top:6px}
  .save{background:#ff6a00;color:#fff}
  .out{background:#fff;color:#d00;border:1px solid #d00}
  .nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee;padding-bottom:env(safe-area-inset-bottom)}
  .nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;font-size:13px;font-weight:bold;color:#999}
  .nav svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav .on{color:#ff6a00}
</style>
</head>
<body>
<div class="top">Profile</div>

<div class="head">
  <div class="av" id="av">?</div>
  <div class="nm" id="nm">...</div>
  <div class="em" id="em"></div>
</div>

<div class="grid">
  <div class="st"><b id="sKills">0</b><span>Total Kills</span></div>
  <div class="st"><b id="sBoo">0</b><span>Booyahs</span></div>
  <div class="st"><b id="sWin">₹0</b><span>Total Winnings</span></div>
  <div class="st"><b id="sBon">₹0</b><span>Bonus</span></div>
</div>

<div class="form">
  <label>Username</label>
  <input id="username">
  <label>Free Fire UID</label>
  <input id="ffuid" inputmode="numeric">
  <button class="save" id="save">Save</button>
    
      <button class="alt" id="pushBtn">Notifications</button>
    
    <button class="alt" onclick="location.href='support.html'">Help &amp; Support</button>
  <button class="out" id="out">Logout</button>
</div>

<div class="nav">
  <div onclick="location.href='home.html'">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</div>
  <div onclick="location.href='wallet.html'">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/></svg>Wallet</div>
  <div onclick="location.href='leaderboard.html'">
    <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Leaderboard</div>
  <div class="on" onclick="location.href='profile.html'">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkwQvjVjrEQqpEIIgWKshbz538lGm7DL8",
  authDomain: "td-esp.firebaseapp.com",
  projectId: "td-esp",
  storageBucket: "td-esp.firebasestorage.app",
  messagingSenderId: "1074367636296",
  appId: "1:1074367636296:web:65189df5578a98cbaa097d"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const g = id => document.getElementById(id);
let me = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "index.html"; return; }
  me = user;
  const u = (await getDoc(doc(db, "users", user.uid))).data();
  g("av").textContent = (u.username || "?")[0].toUpperCase();
  g("nm").textContent = u.username;
  g("em").textContent = u.email;
  g("sKills").textContent = u.kills || 0;
  g("sBoo").textContent = u.booyahs || 0;
  g("sWin").textContent = "₹" + (u.totalWinnings || 0);
  g("sBon").textContent = "₹" + (u.bonus || 0);
  g("username").value = u.username || "";
  g("ffuid").value = u.ffuid || "";
});

g("save").addEventListener("click", async () => {
  const username = g("username").value.trim();
  const ffuid = g("ffuid").value.trim();
  if (!username || !ffuid) { alert("Dono likho"); return; }
  try {
    await updateDoc(doc(db, "users", me.uid), { username, ffuid });
    alert("Save ho gaya ✅");
    location.reload();
  } catch (e) { alert(e.message); }
});

g("out").addEventListener("click", async () => {
  await signOut(auth);
  location.href = "index.html";
});

// ============ NOTIFICATIONS (bell + popup) ============
import * as FS from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
(function () {
  const st = document.createElement("style");
  st.textContent = `
  .tbell{position:relative;width:40px;height:40px;border-radius:50%;background:#f4f4f4;
         display:flex;align-items:center;justify-content:center;flex:none}
  .tbell svg{width:22px;height:22px;stroke:#222;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tbell i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;
           background:#e53935;color:#fff;font:bold 11px Arial;display:none;align-items:center;
           justify-content:center;padding:0 4px;font-style:normal}
  .ntoast{position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#222;color:#fff;
          border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.3);
          transform:translateY(-160%);transition:transform .35s}
  .ntoast.on{transform:translateY(0)}
  .ntoast b{display:block;margin-bottom:2px}
  .ntoast span{font-size:14px;color:#ddd}`;
  document.head.appendChild(st);

  const bell = document.createElement("div");
  bell.className = "tbell";
  bell.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><i></i>';
  bell.onclick = () => { location.href = "notifications.html"; };
  const w = document.getElementById("wallet");
  const top = document.querySelector(".top");
  if (w && w.parentElement && top && top.contains(w)) {
    w.parentElement.prepend(bell);
  } else if (top) {
    top.style.position = "relative";
    bell.style.cssText = "position:absolute;right:14px;top:5px";
    top.appendChild(bell);
  }

  const toast = document.createElement("div");
  toast.className = "ntoast";
  toast.onclick = () => { location.href = "notifications.html"; };
  document.body.appendChild(toast);
  let tm = null;
  function pop(title, body) {
    toast.innerHTML = "<b></b><span></span>";
    toast.querySelector("b").textContent = title;
    toast.querySelector("span").textContent = body;
    toast.classList.add("on");
    if (navigator.vibrate) navigator.vibrate(200);
    clearTimeout(tm);
    tm = setTimeout(() => toast.classList.remove("on"), 5000);
  }

  let seen = 0, first = true;
  auth.onAuthStateChanged(async (user) => {
    if (!user) return;
    try {
      const u = await FS.getDoc(FS.doc(db, "users", user.uid));
      seen = (u.exists() && u.data().notifSeen) || 0;
    } catch (e) {}
    const q = FS.query(FS.collection(db, "users", user.uid, "notifs"),
                       FS.orderBy("createdAt", "desc"), FS.limit(30));
    FS.onSnapshot(q, (snap) => {
        let unread = 0;
      seen = Math.max(seen, window.__seen || 0);
      snap.docs.forEach(d => {
        const c = d.data().createdAt;
        if (c && c.toMillis() > seen) unread++;
      });
      const b = bell.querySelector("i");
      b.textContent = unread > 9 ? "9+" : unread;
      b.style.display = unread ? "flex" : "none";
      if (!first) snap.docChanges().forEach(ch => {
        if (ch.type === "added" && ch.doc.data().createdAt)
          pop(ch.doc.data().title, ch.doc.data().body);
      });
      first = false;
    }, () => {});
  });
})();

(function () {
  const b = document.getElementById("pushBtn");
  const P = () => { try { return parent.tdPush; } catch (e) { return null; } };
  function label() {
    const p = P();
    if (!p) { b.textContent = "Notifications: not available here"; return; }
    const s = p.status();
    b.textContent = s === "granted" ? "Notifications: ON ✅"
      : s === "denied" ? "Notifications: blocked" : "Enable notifications";
  }
  b.addEventListener("click", async () => {
    const p = P();
    if (!p) { alert("Notifications are not available here"); return; }
    const s = p.status();
    if (s === "denied") {
      alert("Notifications are blocked. Open phone Settings > Apps > TD ESP > Notifications and turn them ON.");
      return;
    }
    if (s === "granted") { await p.enable(); alert("Notifications are already ON"); return; }
    await p.enable();
    label();
  });
  setTimeout(label, 1500);
})();

</script>
</body>
</html>
